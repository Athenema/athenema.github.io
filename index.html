<style>
  :root {
    --bg: #05041a;
    --amber: #f5a24a;
    --magenta: #e0409a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: #cfc9e8;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: pinch-zoom;
  }

  /* atmospheric haze, 2049-style */
  body::before {
    content: "";
    position: fixed;
    inset: -20%;
    background:
      radial-gradient(ellipse 60% 45% at 50% 38%, rgba(224, 64, 154, 0.10), transparent 60%),
      radial-gradient(ellipse 50% 40% at 62% 30%, rgba(245, 162, 74, 0.08), transparent 60%),
      radial-gradient(ellipse 80% 60% at 50% 110%, rgba(30, 20, 80, 0.5), transparent 70%);
    animation: haze 14s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes haze {
    from { opacity: 0.7; transform: translateX(-1.5%); }
    to   { opacity: 1;   transform: translateX(1.5%); }
  }

  #dots {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  main {
    position: relative;
    text-align: center;
    z-index: 1;
    padding-inline: 16px;
  }

  /* holds the figure's place; the dots are drawn into this box */
  .mark {
    width: min(46vh, 74vw);
    max-width: 520px;
    aspect-ratio: 1;
    margin: 0 auto;
  }
  /* no JS or no WebGL: the still mark */
  .mark.still {
    background: url("logo.webp") center / 142% no-repeat;
    -webkit-mask-image: radial-gradient(circle at 50% 50%, black 52%, transparent 72%);
            mask-image: radial-gradient(circle at 50% 50%, black 52%, transparent 72%);
  }

  h1 {
    margin-top: 2.6rem;
    font-size: clamp(1.1rem, 3.2vw, 1.9rem);
    font-weight: 200;
    text-transform: uppercase;
    letter-spacing: 0.85em;
    text-indent: 0.85em; /* recenters tracked text */
    color: #e8e2f5;
    text-shadow: 0 0 24px rgba(224, 64, 154, 0.35);
    animation: track 2.4s cubic-bezier(.16, 1, .3, 1) both;
  }
  @keyframes track {
    from { letter-spacing: 0.45em; text-indent: 0.45em; opacity: 0; }
  }

  .present {
    margin-top: 2.2rem;
    font-size: clamp(0.75rem, 1.4vw, 0.85rem);
    font-weight: 300;
    letter-spacing: 0.35em;
    text-indent: 0.35em;
    color: #cfc9e8;
    animation: arrive 0.9s ease-out 0.25s both, fade 5s ease-in-out 1.15s infinite;
  }
  @keyframes arrive { from { opacity: 0; } to { opacity: 0.65; } }
  @keyframes fade {
    0%, 100% { opacity: 0.65; }
    50%      { opacity: 0.92; }
  }

  @media (prefers-reduced-motion: reduce) {
    body::before, h1, .present { animation: none; }
    .present { opacity: 0.8; }
  }
</style>
</head>
<body>
  <canvas id="dots" role="img" aria-label="Athenema"></canvas>
  <main>
    <div class="mark still"></div>
    <script>document.querySelector('.mark').classList.remove('still')</script>
    <h1>Athenema</h1>
    <p class="present">Present.</p>
  </main>
<script>
(() => {
  // assets/logo-v3-original.png as dots, solved by tools/fit.py
  const TOTAL = 6000, GRID = 16, LO = 0.012, HI = 2.5, SIGMA = [0.8, 1.15, 1.7, 2.6, 14.0], HUES = "/xg//xg//wkd/wkd/wkd/wEe/wUU/wYF/w0C/yUA/zUA/zoA/zoA/zoA/zoA/z4A/xFO/xg//xg//wkd/wkd/wEe/wUU/wYF/w0C/yUA/zUA/zoA/zoA/zoA/z4A/z4A/xFO/xFO/xg//xg//wkd/wEe/wUU/wYF/w0C/yUA/zUA/zoA/zoA/z4A/z4A/z4A/xFO/xFO/xFO/xg//wgh/wMb/wIW/wIM/wMD/xwA/zcA/0AA/z4A/z4A/z4A/z4A/xFO/xFO/xFO/wgt/wJB/wE1/wIi/wMN/wQD/xkA/zAA/zwA/zoA/zoA/zoA/yoE/wI//wI//wI//wJP/wFj/wFU/wE5/wMb/wUJ/xAB/yEA/y4A/zEA/zEA/yoE/yoE/wdk/wdk/wdk/wJj/wGQ/wGT/wJu/wI6/wMX/wcF/xIA/xgA/xgB/yoE/yoE/yoE/wel/wel/wel6AX/6wH//wHi/wKq/wJO/wMq/wYO/w4C/xEA/xQA/x0O/x0O/x0O6AL/6AL/6AL/7wT/wgL/1gL//wPE/wNi/wM2/wwg/w8E/xAC/xYC/xsO/xsO/xsOvwD/vwD/vwD/0gX/pAP/4gT//wO0/wJu/wdB/wQz/wQQ/wkI/w0M/w0M/xsO/xsO/xTG/xTG/xTG/wS5zwb/0AX//wPN/wSe/wM1/wE6/wIh/wUV/wUa/wUa/wUa/xsO/xTG/xTG/xTG/wGF/wXtzgX//gX//wRe/wIw/wE0/wUw/wYx/wYx/wUa/wUa/wUa/xTG/xTG/wGF/wGF2QX/0gX//wbj/wNb/wMn/wEq/wMX/x0d/x0d/x0d/wUa/wUa/xTG/wGF6gb/6gb/6gb/4wX/4wX//wgW/wQP/wMT/wQR/yAb/yAb/yAb/yAb/yAb6gb/6gb/6gb/6gb/6gb/4wX/4wX//wgW/wQP/wMT/wQR/yAb/yAb/yAb/yAb/yAb6gb/6gb/6gb/6gb/6gb/4wX/4wX//wgW/wQP/wMT/wQR/yAb/yAb/yAb/yAb/yAb";
  window.dots = () => {}; // the second script still calls this if WebGL is unavailable

  const VERT = `
    attribute vec2 h;   // home: figure units, -.5 to .5 (motes: viewport 0 to 1)
    attribute vec4 c;   // glow rgb, sigma in figure units
    attribute vec3 s;   // seed 0 to 1, dust 0 to 1 (2 for a mote, 3 for an ember), heat
    uniform vec3 V;     // viewport w, h, figure scale (px per unit)
    uniform vec2 C;     // figure centre, px
    uniform vec3 P;     // pointer in figure units, strength
    uniform vec2 T;     // parallax
    uniform float t, D, A; // seconds, device pixels per css pixel, motion amount
    varying vec3 v;
    varying float w, k;
    const float TAU = 6.28318;
    void main() {
      float seed = s.x, dust = min(s.y, 1.), b, cool = 1.;
      vec2 p;
      if (s.y > 2.5) {
        // a bead on the profile sheds an ember: it lifts off the edge, cools from gold to red, gone
        float life = fract(t / (7. + 8. * fract(seed * 7.)) + seed * 5.);
        vec2 dir = normalize(h - vec2(-.1, -.2));
        p = h + dir * (.012 + life * (.06 + .13 * fract(seed * 11.)));
        p += .02 * life * vec2(sin(t * .6 + seed * 30.), cos(t * .5 + seed * 70.));
        p = C + p * V.z;
        b = 1.5 * smoothstep(0., .1, life) * (1. - smoothstep(.6, 1., life)) * smoothstep(1.2, 3., t);
        cool = 1. - life;
      } else if (s.y > 1.5) {
        vec2 q = fract(h + vec2(.0035 - seed * .007, -.006 - seed * .006) * t);
        p = q * V.xy + 14. * vec2(sin(t * .13 + seed * 80.), cos(t * .11 + seed * 50.));
        b = smoothstep(0., .08, q.y) * (1. - smoothstep(.92, 1., q.y)) * smoothstep(0., .08, q.x) * (1. - smoothstep(.92, 1., q.x));
        b *= (.75 + .45 * sin(t * (.2 + seed * .3) + seed * 40.)) * smoothstep(.5, 3.5, t);
      } else {
        // condense: arrive from a loose cloud, most of the travel in the first half second
        float e = clamp((t - seed * .3) / 1.4, 0., 1.);
        e = 1. - pow(1. - e, 4.);
        float a = seed * 917.;
        vec2 home = h + (1. - e) * (h * .9 + (.12 + .3 * fract(seed * 13.)) * vec2(cos(a), sin(a)));

        // the profile holds, the hair flows. Everything here moves as one, so lines stay lines
        float loose = 1. - smoothstep(-.42, .22, h.x + .25 * h.y);
        vec2 q = h * 3.2;
        vec2 flow = vec2(
          sin(q.y + t * .29) + .55 * sin(q.y * 2.1 - t * .21 + q.x),
          cos(q.x * 1.3 + t * .25) + .55 * sin(q.x * 2.3 + q.y + t * .17));
        p = home + A * flow * (.001 + .012 * loose);
        p += A * T * sin(h.x * 2.7 + .6) * cos(h.y * 2.1) * (1. + .6 * loose);

        // only the finest dust has a life of its own, and a share of it lets go and returns
        p += A * .005 * dust * vec2(sin(t * (.35 + seed * .5) + seed * 40.), cos(t * (.3 + seed * .5) + seed * 90.));
        if (dust > .5 && fract(seed * 29.) < .12) {
          float life = fract(t / (19. + 14. * fract(seed * 7.)) + seed * 3.);
          vec2 dir = normalize(vec2(-.55 - .5 * fract(seed * 11.), -.75 + fract(seed * 17.)));
          p += A * dir * life * life * (.04 + .14 * loose) * (1. - smoothstep(.94, 1., life)) * smoothstep(0., 2.5, t);
        }

        // the pointer barely registers: dust leans a few pixels away, lines do not break
        vec2 g = p - P.xy;
        p += A * g / (length(g) + .05) * .012 * P.z * exp(-dot(g, g) / .03) * (.25 + .75 * dust);

        p = C + p * V.z;

        // a slow wave of light, the old 7s breath, travels from the face back through the hair
        float l = .5 + .5 * sin(TAU * t / 7. + h.x * 3. + h.y * 1.2);
        b = mix(1., mix(.86, 1.18, l) * (1. + dust * .35 * sin(t * (.5 + seed) + seed * 60.)), A) * smoothstep(0., .55, e);
      }
      float sig = c.a * V.z * D, sd = max(sig, .5), gain = b * sig * sig / (sd * sd);
      v = c.rgb * gain;
      w = s.z * gain * cool;
      float size = max(sd * 6., 3.);
      k = size * size / (8. * sd * sd);
      gl_Position = vec4(p / V.xy * vec2(2., -2.) + vec2(-1., 1.), 0., 1.);
      gl_PointSize = min(size, 128.);
    }`;

  // every dot is a Gaussian glow plus a narrow gold-white core, g cubed.
  // Additive and clipped per channel, exactly what tools/fit.py solved for.
  const FRAG = `
    precision mediump float;
    varying vec3 v;
    varying float w, k;
    void main() {
      vec2 q = gl_PointCoord - .5;
      float r2 = dot(q, q) * 4.;
      if (r2 > 1.) discard;
      float g = exp(-r2 * k) - exp(-k);
      vec3 col = v * g + vec3(0., 1., .28) * w * g * g * g;
      gl_FragColor = vec4(col, max(col.r, max(col.g, col.b)));
    }`;

  const canvas = document.getElementById('dots');
  const mark = document.querySelector('.mark');
  const still = () => mark.classList.add('still');
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const gl = canvas.getContext('webgl', { antialias: false, powerPreference: 'low-power' });
  if (!gl) return still();

  const bytes64 = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
  const hues = bytes64(HUES);
  // colour is a function of position: bilinear lookup in a coarse grid over the figure
  const hue = (x, y, c) => {
    const gx = x * (GRID - 1), gy = y * (GRID - 1), ix = Math.min(gx | 0, GRID - 2), iy = Math.min(gy | 0, GRID - 2);
    const fx = gx - ix, fy = gy - iy, at = (a, b) => hues[(b * GRID + a) * 3 + c] / 255;
    return (at(ix, iy) * (1 - fx) + at(ix + 1, iy) * fx) * (1 - fy) + (at(ix, iy + 1) * (1 - fx) + at(ix + 1, iy + 1) * fx) * fy;
  };
  // planes, sorted by y: dy | x low | x high and scale | glow and heat
  const MOTES = 80, STRIDE = 9, W = 1253, CX = 578.5, CY = 627.5, SPAN = 877;
  const EMBER_ROWS = 90, data = new Float32Array((TOTAL + MOTES + EMBER_ROWS * 2) * STRIDE);
  let count = MOTES, seed = 0.5;
  const rand = () => (seed = (seed * 9301 + 0.49297) % 1); // seeded: same field every load
  for (let i = 0; i < MOTES; i++) {
    const o = i * STRIDE, hx = rand(), hy = rand();
    data[o] = rand();
    data[o + 1] = rand();
    for (let c = 0; c < 3; c++) data[o + 2 + c] = hue(0.25 + hx * 0.5, 0.2 + hy * 0.6, c) * 0.8;
    data[o + 5] = (1.3 + rand() * 1.4) / SPAN;
    data[o + 6] = rand();
    data[o + 7] = 2;
  }

  // both scripts land here: unpack a batch of dots and start drawing them straight away
  function add(n, encoded) {
    const bytes = bytes64(encoded), from = count;
    let y = 0;
    for (let i = 0; i < n; i++) {
      y += bytes[i];
      const m = bytes[i + n * 2], x = bytes[i + n] | ((m & 3) << 8), scale = m >> 2, p = bytes[i + n * 3];
      const amp = LO * (HI / LO) ** ((p & 31) / 31), o = count++ * STRIDE;
      data[o] = (x / 1023 * W - CX) / SPAN;
      data[o + 1] = (y / 1023 * W - CY) / SPAN;
      for (let c = 0; c < 3; c++) data[o + 2 + c] = hue(x / 1023, y / 1023, c) * amp;
      data[o + 5] = SIGMA[scale] / SPAN;
      data[o + 6] = rand();
      data[o + 7] = scale < 2 ? Math.max(1 - amp / 0.6, 0) : 0;
      data[o + 8] = ((p >> 5) / 7) ** 2 * 3;
    }
    upload(from);
    if (calm) draw(20);
  }

  const upload = from => gl.bufferSubData(gl.ARRAY_BUFFER, from * STRIDE * 4, data.subarray(from * STRIDE, count * STRIDE));

  // the rightmost bright bead on each row is the outer edge of the face: it sheds the embers
  function embers() {
    const edge = new Map(), from = count;
    for (let i = MOTES; i < count; i++) {
      const o = i * STRIDE, row = Math.round(data[o + 1] * EMBER_ROWS);
      if (data[o] > 0.1 && data[o + 2] > 0.4 && (!edge.has(row) || data[o] > data[edge.get(row) * STRIDE])) edge.set(row, i);
    }
    for (const i of edge.values()) {
      const o = count++ * STRIDE;
      data.set(data.subarray(i * STRIDE, (i + 1) * STRIDE), o);
      data[o + 5] = (1.3 + rand() * 1.1) / SPAN;
      data[o + 6] = rand();
      data[o + 7] = 3;
      data[o + 8] = 0.9;
    }
    upload(from);
  }

  const pointer = { x: 0, y: 0, on: 0, ex: 0, ey: 0, es: 0 };
  let u, box, width, height, dpr, start, frame, last = 0;

  function layout() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    width = innerWidth;
    height = innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
    const r = mark.getBoundingClientRect();
    box = { x: r.left + r.width / 2, y: r.top + r.height / 2, s: r.width };
    gl.uniform3f(u.V, width, height, box.s);
    gl.uniform2f(u.C, box.x, box.y);
    gl.uniform1f(u.D, dpr);
    gl.uniform1f(u.A, calm ? 0 : 1);
    if (calm) draw(20);
  }

  function draw(t) {
    // pointer eases in and out, nothing snaps
    pointer.ex += (pointer.x - pointer.ex) * 0.05;
    pointer.ey += (pointer.y - pointer.ey) * 0.05;
    pointer.es += (pointer.on - pointer.es) * 0.04;
    gl.uniform1f(u.t, t);
    gl.uniform3f(u.P, pointer.ex, pointer.ey, pointer.es);
    const lean = v => Math.max(-1, Math.min(1, v)) * pointer.es * 0.2;
    gl.uniform2f(u.T, (lean(pointer.ex) + Math.sin(t * 0.17)) * 0.0035, (lean(pointer.ey) + Math.cos(t * 0.13)) * 0.0035);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.POINTS, 0, count);
  }

  function loop(now) {
    frame = requestAnimationFrame(loop);
    if (now - last < 15) return; // 60fps ceiling: slow motion gains nothing at 120Hz but heat
    last = now;
    start = start || now;
    draw((now - start) / 1000);
  }

  function init() {
    const prog = gl.createProgram();
    for (const [type, src] of [[gl.VERTEX_SHADER, VERT], [gl.FRAGMENT_SHADER, FRAG]]) {
      const sh = gl.createShader(type);
      gl.shaderSource(sh, src);
      gl.compileShader(sh);
      gl.attachShader(prog, sh);
    }
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return still();
    gl.useProgram(prog);
    u = Object.fromEntries(['V', 'C', 'P', 'T', 't', 'D', 'A'].map(k => [k, gl.getUniformLocation(prog, k)]));
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    for (const [name, n, at] of [['h', 2, 0], ['c', 4, 2], ['s', 3, 6]]) {
      const loc = gl.getAttribLocation(prog, name);
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, n, gl.FLOAT, false, STRIDE * 4, at * 4);
    }
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.clearColor(0, 0, 0, 0);
    layout();
    if (!calm) frame = requestAnimationFrame(loop);
  }

  addEventListener('resize', layout);
  const touch = e => {
    pointer.x = (e.clientX - box.x) / box.s;
    pointer.y = (e.clientY - box.y) / box.s;
    pointer.on = 1;
  };
  const release = e => { if (e.pointerType !== 'mouse') pointer.on = 0; };
  addEventListener('pointerdown', touch);
  addEventListener('pointermove', touch);
  addEventListener('pointerup', release);
  addEventListener('pointercancel', release);
  document.documentElement.addEventListener('pointerleave', () => pointer.on = 0);
  canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); cancelAnimationFrame(frame); });
  canvas.addEventListener('webglcontextrestored', init);
  init();
